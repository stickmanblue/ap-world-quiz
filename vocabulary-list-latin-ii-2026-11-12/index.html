<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocabulary List Latin II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f3f5f7;--card:#fff;--fg:#1b2430;--muted:#5d6b7a;--line:#d5dce3;--accent:#1f5f8b;--good:#2e7d4f;--bad:#b23a3a;--warn:#8a6100;
--display:"Source Serif 4",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121820;--card:#1b232d;--fg:#e6ebf0;--muted:#98a6b4;--line:#2e3a47;--accent:#6fb0dc;--good:#5cc28a;--bad:#e57373;--warn:#e0b860;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121820;--card:#1b232d;--fg:#e6ebf0;--muted:#98a6b4;--line:#2e3a47;--accent:#6fb0dc;--good:#5cc28a;--bad:#e57373;--warn:#e0b860;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
main{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1{font:600 1.6rem/1.2 var(--display);margin:0;text-wrap:balance}
h2{font:600 1rem/1.3 var(--body);margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
.sub{color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.quizzes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card)}
.chip:has(input:checked){border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.chip input{margin-top:4px;accent-color:var(--accent)}
.chip b{display:block}.chip small{display:block;color:var(--muted);line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:8px 12px;font:inherit;font-size:.92rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;gap:8px;align-items:center;cursor:pointer}.opt input{accent-color:var(--accent)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font:600 1rem var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.choice:focus-visible,.chip:focus-within,input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600;margin:0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .2s}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:2px dashed var(--line);border-radius:6px;padding:28px 20px;min-height:150px;display:grid;place-items:center;text-align:center}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--warn);color:var(--bg);letter-spacing:.04em}
.prompt{font:600 1.35rem/1.35 var(--display)}
.prompt.en{font:600 1.2rem/1.45 var(--body)}
.psub{color:var(--muted);margin-top:6px}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;cursor:pointer;display:flex;gap:10px}
.choice .k{color:var(--muted);font-variant-numeric:tabular-nums}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.choice.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.choice:disabled{cursor:default}
form.type{display:flex;gap:8px;flex-wrap:wrap}
form.type input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.fb{font-weight:600;margin:0}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}.fb.close{color:var(--warn)}
.note{margin:4px 0 0;color:var(--muted)}
.entry{border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.entry .pp{font:600 1.1rem/1.4 var(--display)}
.entry .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tok{padding:2px 8px;border-radius:4px;border:1px solid var(--line);font-size:.92rem}
.tok.ok{border-color:var(--good);color:var(--good)}.tok.no{border-color:var(--bad);color:var(--bad)}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.results ul{padding-left:0;list-style:none;margin:8px 0 0;display:grid;gap:8px}
kbd{font:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.btn.party{background:linear-gradient(90deg,#ff3b6b,#ff8a2e,#ffcf2e,#2ee6a8,#3ba7ff,#b46bff);background-size:200% 100%;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);animation:shimmer 3s linear infinite;user-select:none;touch-action:manipulation}
.btn.party.pop{animation:shimmer 3s linear infinite,pop .25s ease-out}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes pop{40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.btn.party,.btn.party.pop{animation:none}}
[hidden]{display:none!important}
</style>

<main>
  <header>
    <h1>Vocabulary List Latin II</h1>
    <p class="sub">November 12, 2026 · <span id="total"></span> verbs across <span id="nq"></span> quizzes</p>
  </header>

  <!-- Setup -->
  <section id="setup" style="display:grid;gap:16px">
    <div class="panel">
      <div class="row between" style="margin-bottom:10px">
        <h2 style="margin:0">1. Choose the lists</h2>
        <div class="row"><button class="btn ghost small" id="all">Select all</button><button class="btn ghost small" id="none">Clear</button></div>
      </div>
      <div class="quizzes" id="quizzes"></div>
      <p class="hint">A word counts as <b>mastered</b> after you get it right twice in a row.</p>
    </div>

    <div class="panel">
      <h2>2. Choose how to practice</h2>
      <div class="seg" role="group" aria-label="Practice mode" id="modes">
        <button data-mode="flash">Flashcards</button>
        <button data-mode="mc">Multiple choice</button>
        <button data-mode="type">Type it</button>
        <button data-mode="pp">Principal parts</button>
      </div>
      <p class="hint" id="modehint"></p>
      <div class="seg" role="group" aria-label="Direction" id="dirs" style="margin-top:12px">
        <button data-dir="la">Latin → English</button>
        <button data-dir="en">English → Latin</button>
      </div>
      <div style="display:grid;gap:6px;margin-top:14px">
        <label class="opt"><input type="checkbox" id="shuf"> Shuffle the order</label>
        <label class="opt"><input type="checkbox" id="rep"> Bring missed words back later in the same round</label>
      </div>
    </div>

    <div class="row between">
      <p class="err" id="seterr" aria-live="polite"></p>
      <button class="btn" id="start">Start</button>
    </div>

    <div class="panel" id="troublebox">
      <h2>Trouble words</h2>
      <p class="sub" id="troubletext"></p>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost small" id="trouble">Practice trouble words</button>
        <button class="btn ghost small" id="reset">Reset my progress</button>
      </div>
    </div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden style="display:grid;gap:12px">
    <div class="row between">
      <button class="btn ghost small" id="quit">← Change lists</button>
      <span class="score" id="score"></span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="card"><div>
      <div class="label" id="plabel"></div>
      <div class="prompt" id="prompt"></div>
      <div class="psub" id="psub"></div>
    </div></div>
    <div id="area"></div>
    <div aria-live="polite"><p class="fb" id="fb"></p><p class="note" id="note"></p></div>
    <div id="entry"></div>
    <div class="foot">
      <button class="btn ghost" id="override" hidden>I was right — count it</button>
      <button class="btn" id="next" hidden>Next</button>
    </div>
    <p class="hint" id="keys"></p>
  </section>

  <!-- Results -->
  <section id="results" class="results panel" hidden></section>
</main>

<script>
// [quiz, principal parts, meaning (as on the list), conjugation, English derivatives, extra accepted answers]
const DATA=[
[1,["sum","esse","fuī","futūrum"],"be, exist","irregular","essence, future"],
[1,["possum","posse","potuī"],"be able","irregular","possible, potent"],
[1,["dō","dare","dedī","datum"],"give","1st","data, add"],
[1,["videō","vidēre","vīdī","vīsum"],"see","2nd","video, vision"],
[1,["faciō","facere","fēcī","factum"],"do, make","3rd -iō","fact, factory"],
[1,["dīcō","dīcere","dīxī","dictum"],"say","3rd","dictate, diction"],
[1,["habeō","habēre","habuī","habitum"],"have, hold","2nd","habit, inhabit"],
[1,["ferō","ferre","tulī","lātum"],"bring, bear, carry, endure","irregular","transfer, relate"],
[1,["veniō","venīre","vēnī","ventum"],"come, arrive","4th","advent, convene"],
[1,["volō","velle","voluī"],"wish, want","irregular","volition, voluntary"],
[2,["agō","agere","ēgī","āctum"],"do, act, drive","3rd","agent, act"],
[2,["petō","petere","petīvī","petītum"],"seek, aim at, attack","3rd","petition, compete"],
[2,["iubeō","iubēre","iussī","iussum"],"command, order","2nd","jussive"],
[2,["eō","īre","iī/īvī","itum"],"go","irregular","exit, transit"],
[2,["vincō","vincere","vīcī","victum"],"conquer, win","3rd","victory, invincible"],
[3,["pōnō","pōnere","posuī","positum"],"put, place; put aside","3rd","position, postpone"],
[3,["teneō","tenēre","tenuī","tentum"],"hold, keep","2nd","tenant, tenacious"],
[3,["sequor","sequī","secūtus sum"],"follow","3rd · deponent","sequel, consecutive"],
[3,["crēdō","crēdere","crēdidī","crēditum"],"believe","3rd","credible, credit"],
[3,["accipiō","accipere","accēpī","acceptum"],"receive","3rd -iō","accept"],
[4,["quaerō","quaerere","quaesīvī","quaesītum"],"seek, look for, inquire","3rd","query, inquisitive"],
[4,["mittō","mittere","mīsī","missum"],"send, let go","3rd","mission, transmit"],
[4,["capiō","capere","cēpī","captum"],"seize, catch","3rd -iō","capture, captive"],
[4,["dūcō","dūcere","dūxī","ductum"],"lead, guide","3rd","conduct, duct"],
[4,["relinquō","relinquere","relīquī","relictum"],"abandon, leave behind","3rd","relinquish, relic"],
[5,["fīō","fierī","factus sum"],"become, happen, be done","irregular","fiat"],
[5,["timeō","timēre","timuī"],"to fear, to dread","2nd","timid"],
[5,["dēbeō","dēbēre","dēbuī","dēbitum"],"should, owe, ought","2nd","debt, debit"],
[5,["vīvō","vīvere","vīxī","vīctum"],"live","3rd","vivid, revive"],
[5,["vocō","vocāre","vocāvī","vocātus"],"call, summon","1st","vocal, invoke"],
[6,["parō","parāre","parāvī","parātus"],"prepare, acquire, get; parātus -a -um, ready","1st","prepare, apparatus"],
[6,["inquam","inquis","inquit","inquiunt"],"say (direct speech)","defective",""],
[6,["audiō","audīre","audīvī","audītum"],"hear, listen to","4th","audio, audience"],
[6,["putō","putāre","putāvī","putātus"],"think, suppose","1st","compute, reputation"],
[6,["stō","stāre","stetī","statum"],"stand, wait","1st","status, stable"],
[7,["referō","referre","rettulī","relātum"],"bring back; report","irregular","refer, relate"],
[7,["sciō","scīre","scīvī","scītum"],"know","4th","science, conscious"],
[7,["reddō","reddere","reddidī","redditum"],"return, give back","3rd","render"],
[7,["licet","licēre","licuit","licitum est"],"it is permitted (+ dat. + infin.)","2nd · impersonal","license, illicit",["allowed","it is allowed"]],
[7,["fugiō","fugere","fūgī","fugitum"],"flee, escape","3rd -iō","fugitive, refuge"],
[8,["patior","patī","passus sum"],"suffer, permit, endure","3rd -iō · deponent","patient, passion"],
[8,["moveō","movēre","mōvī","mōtum"],"move","2nd","motion, remove"],
[8,["cadō","cadere","cecidī","cāsum"],"fall, be killed","3rd","cadence, casualty"],
[8,["trahō","trahere","trāxī","trāctum"],"drag, draw","3rd","tractor, attract"],
[8,["amō","amāre","amāvī","amātus"],"to love","1st","amiable, amorous"],
[9,["iaceō","iacēre","iacuī"],"lie down","2nd","adjacent"],
[9,["gerō","gerere","gessī","gestum"],"manage, wear","3rd","gesture, belligerent"],
[9,["premō","premere","pressī","pressum"],"press, pursue, overwhelm","3rd","pressure, oppress"],
[9,["soleō","solēre","soluī","solitum"],"be accustomed, usually","2nd","insolent"],
[9,["cōgō","cōgere","coēgī","coāctum"],"drive together; compel","3rd","cogent"]];

const W=DATA.map(([q,p,en,conj,der,extra],i)=>({i,q,p,en,conj,der,extra:extra||[],id:p[0]}));
const QUIZZES=[...new Set(W.map(w=>w.q))];
const KEY="study-guides:vocabulary-list-latin-ii-2026-11-12:v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// ---- Saved settings and progress (optional; page works without storage) ----
function load(){const d={sel:[1],mode:"mc",dir:"la",shuf:true,rep:true,stats:{}};
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign(d,s)}catch(e){}return d}
const S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const stat=w=>S.stats[w.id]||{seen:0,miss:0,streak:0};
const mastered=w=>stat(w).streak>=2;
const trouble=w=>{const s=stat(w);return s.miss>0&&s.streak<2};

// ---- Answer checking ----
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const normLa=s=>strip(s).replace(/[^a-z\s\/]/g," ").replace(/\s+/g," ").trim();
const normEn=s=>{let t=strip(s).replace(/\(.*?\)/g," ").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim(),p;
  do{p=t;t=t.replace(/^(to|be|it is) /,"")}while(t!==p);return t};
// Edit distance where swapping two adjacent letters counts as one typo
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
const accepts=w=>[...w.en.split(/[;,]/),...w.extra].map(normEn).filter(Boolean);
const tol=s=>s.length>=9?2:s.length>=5?1:0;

function checkEnglish(w,input){
  const parts=input.split(/[;,]/).map(normEn).filter(Boolean);
  if(!parts.length)return{ok:false,msg:"Type a meaning, or choose “I don't know”."};
  const acc=accepts(w);let typo=false;
  const good=parts.every(p=>{if(acc.includes(p))return true;const hit=acc.find(a=>lev(a,p)<=tol(a));if(hit){typo=true;return true}return false});
  if(good)return{ok:true,msg:typo?"Correct — watch the spelling.":"Correct"};
  const other=W.find(o=>o!==w&&parts.every(p=>accepts(o).includes(p)));
  if(other)return{ok:false,msg:`Not this one — “${input.trim()}” is the meaning of ${other.p[0]}.`};
  return{ok:false,msg:"Not quite."};
}
function checkLatin(w,input){
  const n=normLa(input);if(!n)return{ok:false,msg:"Type the Latin, or choose “I don't know”."};
  const target=normLa(w.p[0]);
  if(n===target)return{ok:true,msg:"Correct"};
  const forms=w.p.flatMap(x=>x.split("/")).map(normLa);
  if(forms.includes(n))return{ok:true,msg:`Correct — the dictionary form (first principal part) is ${w.p[0]}.`};
  const other=W.find(o=>o!==w&&normLa(o.p[0])===n);
  if(other)return{ok:false,msg:`That's ${other.p[0]}, which means “${other.en}”.`};
  if(lev(n,target)<=1)return{ok:false,close:true,msg:"Very close — check your spelling."};
  return{ok:false,msg:"Not quite."};
}
const AUX=["sum","est"];
function checkParts(w,input){
  const exp=w.p.slice(1).join(" ").split(" ").filter(t=>!AUX.includes(normLa(t)));
  const got=normLa(input.replace(/,/g," ")).split(" ").filter(t=>t&&!AUX.includes(t));
  if(!got.length)return{ok:false,msg:"Type the remaining principal parts, or choose “I don't know”."};
  const toks=exp.map((e,k)=>{const alts=e.split("/").map(normLa);return{e,ok:got[k]!==undefined&&alts.includes(got[k]),you:got[k]}});
  const ok=toks.every(t=>t.ok)&&got.length===exp.length;
  const right=toks.filter(t=>t.ok).length;
  return{ok,toks,msg:ok?"Correct":got.length>exp.length?`You wrote ${got.length} forms; this verb has ${exp.length} more after ${w.p[0]}.`:`${right} of ${exp.length} forms correct.`};
}

// ---- Setup screen ----
$("total").textContent=W.length;$("nq").textContent=QUIZZES.length;
const MODEHINT={flash:"See the word, recall the answer in your head, then flip and grade yourself honestly.",
  mc:"Pick from four choices. Good for first exposure; switch to Type it once these feel easy.",
  type:"Recall without choices — the best test of whether you really know a word. Macrons are optional.",
  pp:"See the first principal part and meaning, then type the rest (e.g. vidēre vīdī vīsum). Macrons are optional."};
function renderSetup(){
  const box=$("quizzes");box.innerHTML="";
  QUIZZES.forEach(q=>{const ws=W.filter(w=>w.q===q),m=ws.filter(mastered).length;
    const l=document.createElement("label");l.className="chip";
    l.innerHTML=`<input type="checkbox" value="${q}" ${S.sel.includes(q)?"checked":""}><span><b>Quiz ${q}</b><small>${ws.length} words · ${m} mastered</small></span>`;
    l.querySelector("input").onchange=e=>{S.sel=e.target.checked?[...new Set([...S.sel,q])].sort((a,b)=>a-b):S.sel.filter(x=>x!==q);save();updateStart()};
    box.appendChild(l)});
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  document.querySelectorAll("#dirs button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.dir===S.dir);b.disabled=S.mode==="pp"});
  $("modehint").textContent=MODEHINT[S.mode];
  $("shuf").checked=S.shuf;$("rep").checked=S.rep;
  const t=W.filter(trouble);
  $("troubletext").textContent=t.length?`${t.length} word${t.length>1?"s":""} you've missed and haven't yet gotten right twice in a row: ${t.map(w=>w.p[0]).join(", ")}.`:"None yet. Words you miss will collect here until you get them right twice in a row.";
  $("trouble").disabled=!t.length;
  updateStart();
}
const selectedIds=()=>W.filter(w=>S.sel.includes(w.q)).map(w=>w.i);
function updateStart(){const n=selectedIds().length;$("start").textContent=n?`Start · ${n} words`:"Start";$("seterr").textContent=""}
$("all").onclick=()=>{S.sel=QUIZZES.slice();save();renderSetup()};
$("none").onclick=()=>{S.sel=[];save();renderSetup()};
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();renderSetup()});
document.querySelectorAll("#dirs button").forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;save();renderSetup()});
$("shuf").onchange=e=>{S.shuf=e.target.checked;save()};
$("rep").onchange=e=>{S.rep=e.target.checked;save()};
$("start").onclick=()=>{const ids=selectedIds();if(!ids.length){$("seterr").textContent="Pick at least one quiz list first.";return}startRound(ids)};
$("trouble").onclick=()=>startRound(W.filter(trouble).map(w=>w.i));
$("reset").onclick=()=>{if(confirm("Clear your mastered and trouble-word history for this list?")){S.stats={};save();renderSetup()}};

// ---- Round ----
let R;
function show(id){["setup","quiz","results"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function startRound(ids){
  const order=S.shuf?shuffle(ids):ids.slice().sort((a,b)=>a-b);
  R={ids:order.slice(),items:order.map(i=>({i,rep:false})),pos:0,first:new Map(),reps:{},mode:S.mode,dir:S.mode==="pp"?"la":S.dir};
  show("quiz");render();
}
function scoreLine(){const c=[...R.first.values()].filter(Boolean).length;
  $("score").textContent=`Card ${R.pos+1} of ${R.items.length} · ${c}/${R.first.size} right on first try`;
  $("bar").style.width=(R.pos/R.items.length*100)+"%"}
function entryHTML(w){
  return `<div class="entry"><div class="pp">${esc(w.p.join(", "))}</div><div>${esc(w.en)}</div>`+
   `<div class="meta">Quiz ${w.q} · ${esc(w.conj)}${w.der?` · English derivatives: ${esc(w.der)}`:""}</div></div>`}
function render(){
  const it=R.items[R.pos],w=W[it.i];R.answered=false;R.flipped=false;R.undo=null;
  scoreLine();
  $("fb").textContent="";$("fb").className="fb";$("note").textContent="";$("entry").innerHTML="";
  $("next").hidden=true;$("override").hidden=true;
  const badge=it.rep?'<span class="badge">Second look</span>':"";
  const area=$("area");area.innerHTML="";
  if(R.mode==="pp"){
    $("plabel").innerHTML="Principal parts"+badge;$("prompt").className="prompt";$("prompt").textContent=w.p[0];$("psub").textContent=w.en;
  }else if(R.dir==="la"){
    $("plabel").innerHTML="Latin"+badge;$("prompt").className="prompt";
    $("prompt").textContent=R.mode==="type"?w.p.slice(0,2).join(", "):w.p.join(", ");$("psub").textContent="";
  }else{
    $("plabel").innerHTML="English"+badge;$("prompt").className="prompt en";$("prompt").textContent=w.en;$("psub").textContent="";
  }
  if(R.mode==="flash"){
    area.innerHTML=`<div class="foot" style="justify-content:center"><button class="btn" id="flip">Show answer</button></div>`;
    $("flip").onclick=flip;$("flip").focus();
    $("keys").innerHTML="<kbd>Space</kbd> flip · <kbd>1</kbd> still learning · <kbd>2</kbd> got it";
  }else if(R.mode==="mc"){
    const pool=shuffle(W.filter(o=>o!==w));const opts=[w];
    const label=o=>R.dir==="la"?o.en:o.p.slice(0,2).join(", ");
    for(const o of pool){if(opts.length===4)break;if(!opts.some(x=>label(x)===label(o)))opts.push(o)}
    R.opts=shuffle(opts);
    const box=document.createElement("div");box.className="choices";
    R.opts.forEach((o,n)=>{const b=document.createElement("button");b.className="choice";
      b.innerHTML=`<span class="k">${n+1}</span><span>${esc(label(o))}</span>`;b.onclick=()=>choose(n);box.appendChild(b)});
    area.appendChild(box);
    $("keys").innerHTML="<kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> next";
  }else{
    const ph=R.mode==="pp"?"remaining parts, e.g. vidēre vīdī vīsum":R.dir==="la"?"an English meaning":"the Latin (first principal part)";
    area.innerHTML=`<form class="type" id="tf" autocomplete="off"><input type="text" id="ans" placeholder="Type ${ph}" aria-label="Your answer" autocapitalize="off" spellcheck="false">`+
      `<button class="btn" type="submit">Check</button><button class="btn ghost" type="button" id="hintb">Hint</button><button class="btn ghost" type="button" id="idk">I don't know</button></form>`;
    R.hints=0;
    $("tf").onsubmit=e=>{e.preventDefault();submitTyped(false)};
    $("idk").onclick=()=>submitTyped(true);
    $("hintb").onclick=giveHint;
    $("ans").focus();
    $("keys").innerHTML="<kbd>Enter</kbd> check, then <kbd>Enter</kbd> next · macrons not required";
  }
}
function record(ok){
  const it=R.items[R.pos],w=W[it.i];
  const prev={...stat(w)},hadFirst=R.first.has(it.i);
  if(!it.rep&&!hadFirst)R.first.set(it.i,ok);
  const s={...prev,seen:prev.seen+1};if(ok)s.streak++;else{s.miss++;s.streak=0}
  S.stats[w.id]=s;save();
  let at=-1;
  if(!ok&&S.rep&&(R.reps[it.i]||0)<2){R.reps[it.i]=(R.reps[it.i]||0)+1;
    at=Math.min(R.items.length,R.pos+3+(Math.random()*3|0));R.items.splice(at,0,{i:it.i,rep:true})}
  R.undo={prev,hadFirst,at};
  R.answered=true;scoreLine();
}
function showAfter(ok,msg,cls){
  const w=W[R.items[R.pos].i];
  $("fb").textContent=msg;$("fb").className="fb "+(cls||(ok?"ok":"no"));
  if(!ok&&R.undo&&R.undo.at>=0)$("note").textContent="This word will come back in a few cards.";
  $("entry").innerHTML=entryHTML(w);
  $("next").hidden=false;$("next").textContent=R.pos+1<R.items.length?"Next":"See results";$("next").focus();
}
function choose(n){
  if(R.answered||R.mode!=="mc")return;const w=W[R.items[R.pos].i],ok=R.opts[n]===w;
  [...document.querySelectorAll(".choice")].forEach((c,k)=>{c.disabled=true;if(R.opts[k]===w)c.classList.add("right");else if(k===n)c.classList.add("wrong")});
  record(ok);
  let msg=ok?"Correct":"Not quite — the correct answer is marked.";
  if(!ok){const o=R.opts[n];msg+=R.dir==="la"?` “${o.en}” is ${o.p[0]}.`:` ${o.p[0]} means “${o.en}”.`}
  showAfter(ok,msg);
}
function flip(){
  if(R.flipped)return;R.flipped=true;const w=W[R.items[R.pos].i];
  $("entry").innerHTML=entryHTML(w);
  $("area").innerHTML=`<div class="foot" style="justify-content:center"><button class="btn ghost" id="g0">Still learning</button><button class="btn" id="g1">Got it</button></div>`;
  $("g0").onclick=()=>grade(false);$("g1").onclick=()=>grade(true);$("g1").focus();
}
function grade(ok){if(!R.flipped||R.answered)return;record(ok);next()}
function giveHint(){
  const w=W[R.items[R.pos].i];R.hints++;
  const target=R.mode==="pp"?w.p.slice(1).join(" "):R.dir==="la"?w.en.split(/[;,]/)[0].trim():w.p[0];
  const n=Math.min(target.length,R.hints*2);
  $("note").textContent=`Starts with: ${target.slice(0,n)}…`;$("ans").focus();
}
function submitTyped(gaveUp){
  if(R.answered)return;const w=W[R.items[R.pos].i],input=$("ans").value;
  let r;
  if(gaveUp)r={ok:false,msg:"No problem — study the entry below. It will come back."};
  else r=R.mode==="pp"?checkParts(w,input):R.dir==="la"?checkEnglish(w,input):checkLatin(w,input);
  if(!gaveUp&&!input.trim()){$("fb").textContent=r.msg;$("fb").className="fb no";return}
  $("ans").disabled=true;$("tf").querySelectorAll("button").forEach(b=>b.disabled=true);
  record(r.ok);
  showAfter(r.ok,r.msg,r.close?"close":null);
  if(r.toks&&!r.ok){$("entry").insertAdjacentHTML("afterbegin",`<div class="tokens" style="margin-bottom:8px">${r.toks.map(t=>`<span class="tok ${t.ok?"ok":"no"}">${t.ok?"✓":"✗"} ${esc(t.e)}${!t.ok&&t.you?` (you: ${esc(t.you)})`:""}</span>`).join("")}</div>`)}
  if(!r.ok&&!gaveUp&&input.trim())$("override").hidden=false;
}
$("override").onclick=()=>{
  const it=R.items[R.pos],w=W[it.i],u=R.undo;if(!u)return;
  if(u.at>=0){R.items.splice(u.at,1);R.reps[it.i]--}
  if(!it.rep&&!u.hadFirst)R.first.set(it.i,true);
  S.stats[w.id]={...u.prev,seen:u.prev.seen+1,streak:u.prev.streak+1};save();
  R.undo=null;$("override").hidden=true;$("note").textContent="";
  $("fb").textContent="Counted as correct.";$("fb").className="fb ok";scoreLine();
  $("next").textContent=R.pos+1<R.items.length?"Next":"See results";$("next").focus();
};
function next(){R.pos++;R.pos<R.items.length?render():finish()}
$("next").onclick=next;
$("quit").onclick=()=>{show("setup");renderSetup()};

document.addEventListener("keydown",e=>{
  if($("quiz").hidden||!R)return;const tag=e.target.tagName;
  if(tag==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(R.mode==="flash"){
    if(!R.flipped&&e.key===" "){e.preventDefault();flip()}
    else if(R.flipped&&e.key==="1")grade(false);
    else if(R.flipped&&e.key==="2")grade(true);
    return}
  if(R.mode==="mc"&&!R.answered&&/^[1-4]$/.test(e.key))choose(+e.key-1);
  else if(R.answered&&e.key==="Enter"&&tag!=="BUTTON"){e.preventDefault();next()}
});

function finish(){
  show("results");
  const total=R.ids.length,right=R.ids.filter(i=>R.first.get(i)).length,pct=Math.round(right/total*100);
  const missed=R.ids.filter(i=>!R.first.get(i));
  const msg=pct===100?"Perfect round. Come back tomorrow and do it again — spacing out reviews is what makes words stick."
   :pct>=80?"Strong work. Retry the few you missed now, then review them again later today."
   :pct>=50?"Getting there. Retry the missed words now, and say each one out loud with its meaning."
   :"Good start — these are new words. Try Flashcards or Multiple choice first, then come back to this mode.";
  const tips=[];
  if(R.mode==="mc"||R.mode==="flash")tips.push("When this feels easy, switch to <b>Type it</b>. Recalling a word without choices is a stronger test than recognizing it.");
  if(R.mode!=="pp")tips.push(R.dir==="la"?"Try <b>English → Latin</b> too. Knowing a word in both directions is what you need for writing and translating.":"Try <b>Principal parts</b> mode — you need all the parts to recognize perfect and passive forms.");
  const el=$("results");
  el.innerHTML=`<div class="label">Results</div><div class="prompt">${right} of ${total} right on the first try (${pct}%)</div>`+
   `<p class="sub" style="margin-top:8px">${msg}</p>`+
   (missed.length?`<h2 style="margin-top:16px">Words to review</h2><ul>${missed.map(i=>`<li>${entryHTML(W[i])}</li>`).join("")}</ul>`:"")+
   (tips.length?`<h2 style="margin-top:16px">Next step</h2>${tips.map(t=>`<p class="sub" style="margin:0 0 6px">${t}</p>`).join("")}`:"")+
   `<div class="foot" style="margin-top:16px;justify-content:flex-start">`+
   (pct===100?`<button class="btn party" id="party">🎉 More confetti!</button>`:"")+
   (missed.length?`<button class="btn" id="retry">Retry the ${missed.length} I missed</button>`:"")+
   `<button class="btn ghost" id="again">Run these ${total} again</button><button class="btn ghost" id="back">Change lists or mode</button></div>`;
  if(pct===100){celebrate();const b=$("party");
    b.onclick=()=>{Confetti.blast(1);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")};b.focus()}
  else if($("retry")){$("retry").onclick=()=>startRound(missed);$("retry").focus()}else $("again").focus();
  $("again").onclick=()=>startRound(R.ids);
  $("back").onclick=()=>{show("setup");renderSetup()};
}
// Confetti cannons for a perfect round. One shared canvas and animation loop, so the
// "More confetti" button can be clicked as fast as you like without slowing the page.
const Confetti=(()=>{
  const COLORS=["#ff3b6b","#ffcf2e","#2ee6a8","#3ba7ff","#b46bff","#ff8a2e","#ffffff","#ff5ad1"];
  const MAX=2200;let c,ctx,parts=[],running=false,last=0;
  function ensure(){
    if(c)return;c=document.createElement("canvas");c.setAttribute("aria-hidden","true");
    c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";
    document.body.appendChild(c);ctx=c.getContext("2d");
    const size=()=>{const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)};
    size();addEventListener("resize",size);
  }
  // Fire n pieces from (x,y) toward angle (degrees, 0 = right, -90 = straight up) within a spread
  function cannon(x,y,angle,spread,n,power){
    const H=innerHeight;
    for(let k=0;k<n;k++){
      const a=(angle+(Math.random()-.5)*spread)*Math.PI/180,sp=H*(.022+Math.random()*.03)*power;
      const shape=Math.random();
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        w:shape<.15?6:7+Math.random()*7,h:shape<.15?6:shape<.35?16+Math.random()*10:4+Math.random()*5,
        round:shape<.15,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,
        flip:Math.random()*6.28,vf:.08+Math.random()*.18,sway:Math.random()*6.28,
        col:COLORS[Math.random()*COLORS.length|0],age:0});
    }
    if(parts.length>MAX)parts.splice(0,parts.length-MAX);
  }
  function blast(power=1){
    ensure();const W=innerWidth,H=innerHeight,n=Math.round((W<600?70:120)*power);
    cannon(0,H,-62,30,n,1.05);                // bottom-left corner, up and right
    cannon(W,H,-118,30,n,1.05);               // bottom-right corner, up and left
    cannon(W/2,H,-90,50,Math.round(n*.7),1.15); // straight up the middle
    if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}
  }
  function tick(t){
    const dt=Math.min(2.5,(t-last)/16.67);last=t;
    const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);
    for(let k=parts.length-1;k>=0;k--){
      const p=parts[k];p.age+=dt;
      p.vx*=Math.pow(.965,dt);p.vy=p.vy*Math.pow(.965,dt)+.32*dt;  // drag + gravity
      if(p.vy>3.2)p.vy=3.2;                                          // flutter down slowly
      p.sway+=.05*dt;p.x+=(p.vx+Math.sin(p.sway)*1.1)*dt;p.y+=p.vy*dt;
      p.rot+=p.vr*dt;p.flip+=p.vf*dt;
      if(p.y>H+40||p.x<-60||p.x>W+60){parts.splice(k,1);continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.flip));
      ctx.globalAlpha=p.age>420?Math.max(0,1-(p.age-420)/60):1;ctx.fillStyle=p.col;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.w/2,0,6.28);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      if(p.age>480)parts.splice(k,1);
    }
    if(parts.length)requestAnimationFrame(tick);else{running=false;ctx.clearRect(0,0,W,H)}
  }
  return{blast};
})();
// Automatic celebration: three volleys. Skipped for viewers who ask their system to reduce
// motion; the button still works for them because pressing it is their own choice.
function celebrate(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  Confetti.blast(1.2);setTimeout(()=>Confetti.blast(.8),350);setTimeout(()=>Confetti.blast(1),900);
}
renderSetup();
</script>
</html>
